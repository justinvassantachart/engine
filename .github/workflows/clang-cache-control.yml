name: Clang SDK29 control and observer candidates

on:
  workflow_dispatch:
    inputs:
      arm:
        description: Build the unmodified control or a gated observer candidate
        type: choice
        options: [control, observer]
        default: control
  push:
    branches: [codex/compiler-cache-overhaul]
    paths:
      # Ordinary implementation and conformance commits must not queue another
      # multi-hour control. A fresh build is an explicit request or dispatch.
      - toolchains/clang-cache-receipt/build-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: clang-sdk29-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select explicit build arm
        id: selection
        env:
          REQUESTED_ARM: ${{ inputs.arm }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          arm = os.environ.get('REQUESTED_ARM')
          if not arm:
              arm = json.loads(Path('toolchains/clang-cache-receipt/build-request.json').read_text())['arm']
          if arm not in ('control', 'observer'):
              raise SystemExit('Unknown requested compiler build arm')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'arm={arm}\n')
          PY
      - name: Build frozen host environment
        id: environment
        run: |
          mkdir -p "$RUNNER_TEMP/clang-control/evidence"
          docker build --progress=plain -t webide-clang-control toolchains/clang-cache-receipt 2>&1 | tee "$RUNNER_TEMP/clang-control/evidence/container-build.log"
          docker image inspect webide-clang-control > "$RUNNER_TEMP/clang-control/evidence/container-image.json"
      - name: Restore verified observer build state
        if: steps.selection.outputs.arm == 'observer'
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/clang-control/yowasp
            ${{ runner.temp }}/clang-control/ccache
            ${{ runner.temp }}/clang-control/wasi-sdk-29.tar.gz
            ${{ runner.temp }}/clang-control/state
          key: clang-sdk29-observer-state-v1-${{ hashFiles('toolchains/clang-cache-receipt/Dockerfile', 'toolchains/clang-cache-receipt/inputs.json', 'toolchains/clang-cache-receipt/npm/package.json', 'toolchains/clang-cache-receipt/npm/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clang-sdk29-observer-state-v1-${{ hashFiles('toolchains/clang-cache-receipt/Dockerfile', 'toolchains/clang-cache-receipt/inputs.json', 'toolchains/clang-cache-receipt/npm/package.json', 'toolchains/clang-cache-receipt/npm/package-lock.json') }}-
      - name: Build explicitly selected source candidate
        id: build
        env:
          BUILD_ARM: ${{ steps.selection.outputs.arm }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/recipe:ro" \
            -v "$RUNNER_TEMP/clang-control:/work" \
            webide-clang-control \
            bash "/recipe/toolchains/clang-cache-receipt/build-$BUILD_ARM.sh" /work
      - name: Record exact reusable observer build state
        if: always() && steps.selection.outputs.arm == 'observer' && steps.environment.outcome == 'success'
        id: state
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          test -f "$RUNNER_TEMP/clang-control/state/provenance.json"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/recipe:ro" \
            -v "$RUNNER_TEMP/clang-control:/work" \
            webide-clang-control \
            python3 /recipe/toolchains/clang-cache-receipt/build-state.py record /work \
            > "$RUNNER_TEMP/clang-control/evidence/build-state.json"
          printf '%s\n' "$BUILD_OUTCOME" > "$RUNNER_TEMP/clang-control/evidence/build-outcome.txt"
          cp "$RUNNER_TEMP/clang-control/state/provenance.json" "$RUNNER_TEMP/clang-control/evidence/state-provenance.json"
      - name: Save immutable observer build state
        if: always() && steps.state.outcome == 'success'
        id: save
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/clang-control/yowasp
            ${{ runner.temp }}/clang-control/ccache
            ${{ runner.temp }}/clang-control/wasi-sdk-29.tar.gz
            ${{ runner.temp }}/clang-control/state
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Verify reusable state was saved
        if: always() && steps.state.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_KEY: ${{ steps.restore.outputs.cache-primary-key }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          result = None
          for attempt in range(3):
              response = json.loads(subprocess.check_output([
                  'gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/caches?key={os.environ['STATE_KEY']}"
              ]))
              result = next((item for item in response.get('actions_caches', [])
                             if item.get('key') == os.environ['STATE_KEY'] and item.get('size_in_bytes', 0) > 0), None)
              if result:
                  break
              time.sleep(2)
          output = Path(os.environ['RUNNER_TEMP']) / 'clang-control/evidence/cache-confirmation.json'
          output.write_text(json.dumps({'key': os.environ['STATE_KEY'], 'confirmed': bool(result), 'cache': result}, indent=2) + '\n')
          if not result:
              raise SystemExit('Build artifacts are preserved, but reusable build-state saving was not confirmed')
          PY
      - name: Preserve control artifacts and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clang-sdk29-${{ steps.selection.outputs.arm }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clang-control/evidence/
            ${{ runner.temp }}/clang-control/artifacts/
          if-no-files-found: error
          retention-days: 30
